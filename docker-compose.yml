version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: capex-scout-db
    environment:
      POSTGRES_USER: capex
      POSTGRES_PASSWORD: capex_dev
      POSTGRES_DB: capex_scout
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capex -d capex_scout"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

